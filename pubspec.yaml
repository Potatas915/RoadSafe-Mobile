name: roadsafe_mobile
description: "RoadTrack Mobile Application built in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.27.1
  image_picker: ^1.2.4
  http: ^1.2.0
  geolocator: ^11.0.0
  shared_preferences: ^2.2.2
  supabase_flutter: 2.18.3
  uuid: 4.6.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/accidents/


